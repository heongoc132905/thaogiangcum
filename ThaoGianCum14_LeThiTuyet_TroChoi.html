<!doctype html>
<html lang="vi" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Em yêu Văn học</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Times New Roman', Times, serif;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      background: linear-gradient(135deg, #f3e8ff 0%, #fce7f3 50%, #e9d5ff 100%);
      overflow-y: auto;
    }

    .title-font {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: bold;
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 1rem;
      position: relative;
      width: 100%;
    }

    .absolute {
      position: absolute;
    }

    .top-4 { top: 1rem; }
    .right-4 { right: 1rem; }
    .bottom-4 { bottom: 1rem; }
    .left-4 { left: 1rem; }

    /* Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(147, 51, 234, 0.3); }
      50% { box-shadow: 0 0 40px rgba(147, 51, 234, 0.6); }
    }

    @keyframes sparkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    @keyframes bounce-in {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    @keyframes firework {
      0% { transform: scale(0) rotate(0deg); opacity: 1; }
      50% { opacity: 1; }
      100% { transform: scale(1.5) rotate(180deg); opacity: 0; }
    }

    @keyframes confetti-fall {
      0% { transform: translateY(-100%) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100%) rotate(720deg); opacity: 0; }
    }

    @keyframes cry {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes tear-drop {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(30px); opacity: 0; }
    }

    .float-animation {
      animation: float 3s ease-in-out infinite;
      font-size: 2.25rem;
    }

    .sparkle {
      animation: sparkle 1.5s ease-in-out infinite;
      font-size: 1.875rem;
    }

    .pulse-glow {
      animation: pulse-glow 2s ease-in-out infinite;
    }

    /* Start Screen */
    #start-screen {
      text-align: center;
    }

    #start-screen.hidden {
      display: none;
    }

    .mb-6 { margin-bottom: 1.5rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-8 { margin-bottom: 2rem; }
    .mt-6 { margin-top: 1.5rem; }
    .mt-4 { margin-top: 1rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mr-2 { margin-right: 0.5rem; }

    #main-title {
      font-size: 3rem;
      font-weight: 900;
      color: #6b21a8;
      margin-bottom: 1rem;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
    }

    @media (min-width: 768px) {
      #main-title {
        font-size: 3.5rem;
      }
    }

    .text-purple-600 {
      color: #9333ea;
    }

    .text-purple-500 {
      color: #a855f7;
    }

    .text-purple-400 {
      color: #c084fc;
    }

    .text-purple-700 {
      color: #7e22ce;
    }

    .text-purple-800 {
      color: #6b21a8;
    }

    .text-xl {
      font-size: 1.25rem;
    }

    .text-sm {
      font-size: 0.875rem;
    }

    .text-6xl {
      font-size: 3.75rem;
    }

    .text-3xl {
      font-size: 1.875rem;
    }

    .text-4xl {
      font-size: 2.25rem;
    }

    .text-5xl {
      font-size: 3rem;
    }

    .text-8xl {
      font-size: 6rem;
    }

    /* Button Styles */
    button {
      cursor: pointer;
      border: none;
      font-family: inherit;
    }

    .btn-start {
      background: linear-gradient(to right, #a855f7, #ec4899);
      color: white;
      padding: 1rem 2.5rem;
      border-radius: 9999px;
      font-size: 1.25rem;
      font-weight: bold;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      animation: pulse-glow 2s ease-in-out infinite;
    }

    .btn-start:hover {
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      transform: scale(1.05);
    }

    /* Quiz Screen */
    #quiz-screen {
      width: 100%;
      max-width: 56rem;
    }

    #quiz-screen.hidden {
      display: none;
    }

    .progress-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .progress-bar-container {
      width: 100%;
      background: #e9d5ff;
      border-radius: 9999px;
      height: 0.75rem;
      overflow: hidden;
    }

    #progress-bar {
      background: linear-gradient(to right, #a855f7, #ec4899);
      height: 100%;
      border-radius: 9999px;
      transition: width 0.5s ease;
    }

    .score-display {
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .score-box {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(4px);
      padding: 0.5rem 1.5rem;
      border-radius: 9999px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .question-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      border-radius: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      padding: 1.5rem;
      border: 4px solid #e9d5ff;
    }

    @media (min-width: 768px) {
      .question-card {
        padding: 2rem;
      }
    }

    .question-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    #question-number {
      background: #a855f7;
      color: white;
      padding: 0.25rem 1rem;
      border-radius: 9999px;
      font-weight: bold;
    }

    #question-text {
      font-size: 1.125rem;
      color: #6b21a8;
      font-weight: 600;
      margin-bottom: 1.5rem;
      line-height: 1.625;
    }

    #options-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .option-btn {
      text-align: left;
      padding: 1rem;
      background: linear-gradient(135deg, #f3e8ff, #fce7f3);
      border: 2px solid #e9d5ff;
      border-radius: 0.75rem;
      color: #6b21a8;
      font-weight: 500;
      font-size: 1.125rem;
      transition: all 0.3s ease;
    }

    .option-btn:hover {
      background: linear-gradient(135deg, #e9d5ff, #fbcfe8);
      border-color: #e9d5ff;
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(147, 51, 234, 0.3);
    }

    .option-btn:disabled {
      opacity: 0.6;
    }

    .correct-answer {
      background: linear-gradient(135deg, #10b981, #059669) !important;
      color: white !important;
      border-color: #10b981 !important;
      animation: bounce-in 0.5s ease-out;
    }

    .wrong-answer {
      background: linear-gradient(135deg, #ef4444, #dc2626) !important;
      color: white !important;
      border-color: #ef4444 !important;
      animation: shake 0.5s ease-in-out;
    }

    #next-btn-container {
      display: flex;
      justify-content: center;
      margin-top: 1.5rem;
    }

    #next-btn-container.hidden {
      display: none;
    }

    .btn-next {
      background: linear-gradient(to right, #9333ea, #db2777);
      color: white;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      font-size: 1.125rem;
      font-weight: bold;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .btn-next:hover {
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      transform: scale(1.05);
    }

    .mascot {
      font-size: 3.5rem;
      animation: float 3s ease-in-out infinite;
      display: flex;
      justify-content: center;
      margin-top: 1.5rem;
    }

    /* Result Screen */
    #result-screen {
      text-align: center;
    }

    #result-screen.hidden {
      display: none;
    }

    #result-emoji {
      font-size: 8rem;
      margin-bottom: 1.5rem;
    }

    #result-title {
      font-size: 2.25rem;
      font-weight: bold;
      color: #6b21a8;
      margin-bottom: 1rem;
    }

    #result-message {
      font-size: 1.25rem;
      color: #9333ea;
      margin-bottom: 1rem;
    }

    .result-box {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(4px);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      margin-bottom: 1.5rem;
      display: inline-block;
    }

    .result-score {
      font-size: 1.5rem;
      color: #6b21a8;
    }

    #final-score {
      font-weight: bold;
      font-size: 1.875rem;
      color: #ec4899;
    }

    .btn-restart {
      background: linear-gradient(to right, #a855f7, #ec4899);
      color: white;
      padding: 1rem 2.5rem;
      border-radius: 9999px;
      font-size: 1.25rem;
      font-weight: bold;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .btn-restart:hover {
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      transform: scale(1.05);
    }

    /* Feedback Overlay */
    #feedback-overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 50;
    }

    #feedback-overlay.hidden {
      display: none;
    }

    #feedback-content {
      text-align: center;
      animation: bounce-in 0.5s ease-out forwards;
    }

    .feedback-emoji {
      font-size: 6rem;
      margin-bottom: 1rem;
    }

    .feedback-title {
      font-size: 1.875rem;
      font-weight: bold;
      margin-top: 1rem;
    }

    .feedback-title.correct {
      color: #10b981;
    }

    .feedback-title.wrong {
      color: #ef4444;
    }

    .feedback-message {
      font-size: 1.25rem;
      color: #9333ea;
      margin-top: 0.5rem;
    }

    /* Fireworks */
    #fireworks-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 40;
    }

    .firework-particle {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: firework 1s ease-out forwards;
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      animation: confetti-fall 3s linear forwards;
    }

    .flex { display: flex; }
    .flex-between { display: flex; justify-content: space-between; }
    .justify-center { justify-content: center; }
    .items-center { align-items: center; }
    .gap-4 { gap: 1rem; }
    .gap-3 { gap: 0.75rem; }

    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }

  </style>
 </head>
 <body>
  <div id="app" class="app">
    <!-- Decorative Elements -->
    <div class="absolute top-4 left-4 float-animation" style="animation-delay: 0s;">📚</div>
    <div class="absolute top-4 right-4 float-animation" style="animation-delay: 0.5s;">✨</div>
    <div class="absolute bottom-4 left-4 float-animation" style="animation-delay: 1s;">🌸</div>
    <div class="absolute bottom-4 right-4 float-animation" style="animation-delay: 1.5s;">💜</div>

    <!-- Start Screen -->
    <div id="start-screen">
      <div class="mb-6"><span class="text-6xl">📖</span></div>
      <h1 id="main-title" class="title-font">Em yêu Văn học</h1>
      <p class="text-purple-600 text-xl mb-2">🌟 Khởi động môn Ngữ Văn 🌟</p>
      <p class="text-purple-500 mb-8">Cùng ôn tập kiến thức về cấu trúc đề thi nhé!</p>
      <div class="flex justify-center gap-4 mb-6">
        <span class="sparkle" style="animation-delay: 0s;">⭐</span>
        <span class="sparkle" style="animation-delay: 0.3s;">💫</span>
        <span class="sparkle" style="animation-delay: 0.6s;">⭐</span>
      </div>
      <button onclick="startGame()" class="btn-start">🚀 Bắt đầu chơi!</button>
      <div class="mt-6 text-purple-400 text-sm">📝 4 câu hỏi • ⏱️ Không giới hạn thời gian</div>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hidden">
      <div class="mb-6">
        <div class="progress-container">
          <span class="text-purple-600 font-semibold">Tiến độ</span>
          <span id="progress-text" class="text-purple-600 font-semibold">Câu 1/4</span>
        </div>
        <div class="progress-bar-container">
          <div id="progress-bar" style="width: 0%"></div>
        </div>
      </div>

      <div class="score-display">
        <div class="score-box">
          <span class="text-purple-600">🏆 Điểm: </span>
          <span id="score" class="text-purple-700 font-bold">0</span>
        </div>
      </div>

      <div class="question-card">
        <div class="question-header">
          <span class="text-3xl">📝</span>
          <span id="question-number">Câu 1</span>
        </div>
        <h2 id="question-text"></h2>
        <div id="options-container"></div>
        <div id="next-btn-container" class="hidden">
          <button onclick="nextQuestion()" class="btn-next">Câu tiếp theo ➡️</button>
        </div>
      </div>

      <div class="mascot" id="mascot">🐱</div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden">
      <div id="result-emoji" class="text-8xl"></div>
      <h2 id="result-title" class="title-font"></h2>
      <p id="result-message"></p>
      <div class="result-box">
        <p class="result-score">🏆 Tổng điểm: <span id="final-score"></span>/4</p>
      </div>
      <button onclick="restartGame()" class="btn-restart">🔄 Chơi lại</button>
    </div>

    <!-- Fireworks Container -->
    <div id="fireworks-container"></div>

    <!-- Feedback Overlay -->
    <div id="feedback-overlay" class="hidden">
      <div id="feedback-content"></div>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "Cấu trúc đề thi Ngữ văn tốt nghiệp Trung học Phổ thông gồm mấy phần?",
        options: [
          "A. 01 phần: Phần viết",
          "B. 02 phần: Phần đọc và phần viết",
          "C. 03 phần: Phần đọc, phần viết và phần nói",
          "D. 04 phần: Phần đọc, phần viết, phần nói và phần nghe"
        ],
        correct: 1
      },
      {
        question: "Theo cấu trúc đề thi tốt nghiệp THPT, nếu ngữ liệu Phần Đọc là văn bản văn học thì Phần Viết đoạn sẽ là (1)…? Phần viết bài sẽ là (2)…?. Nếu ngữ liệu Phần Đọc là văn bản thông tin/văn bản nghị luận thì Phần Viết đoạn sẽ là (3)…? Phần viết bài sẽ là (4)…?.",
        options: [
          "A. (1) Nghị luận văn học - (2) Nghị luận xã hội; (3) Nghị luận xã hội - (4) Nghị luận văn học",
          "B. (1) Nghị luận xã hội - (2) Nghị luận văn học; (3) Nghị luận văn học - (4) Nghị luận xã hội",
          "C. (1) Nghị luận văn học - (2) Nghị luận văn học; (3) Nghị luận xã hội - (4) Nghị luận xã hội",
          "D. (1) Nghị luận xã hội - (2) Nghị luận xã hội; (3) Nghị luận văn học - (4) Nghị luận văn học"
        ],
        correct: 0
      },
      {
        question: "Câu viết đoạn văn có dung lượng khoảng bao nhiêu chữ? Câu viết bài văn có dung lượng khoảng bao nhiêu chữ?",
        options: [
          "A. Đoạn văn: 150 chữ; Bài văn: 500 chữ",
          "B. Đoạn văn: 200 chữ; Bài văn: 600 chữ",
          "C. Đoạn văn: 250 chữ; Bài văn: 700 chữ",
          "D. Đoạn văn: 300 chữ; Bài văn: 800 chữ"
        ],
        correct: 1
      },
      {
        question: "Câu viết đoạn trong đề thi tốt nghiệp Trung học Phổ thông có số điểm là bao nhiêu?",
        options: [
          "A. 1.0 điểm",
          "B. 1.5 điểm",
          "C. 2.0 điểm",
          "D. 2.5 điểm"
        ],
        correct: 2
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let questionAnsweredCorrectly = false;

    function startGame() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      currentQuestion = 0;
      score = 0;
      questionAnsweredCorrectly = false;
      updateScore();
      showQuestion();
    }

    function showQuestion() {
      questionAnsweredCorrectly = false;
      const q = questions[currentQuestion];

      document.getElementById('question-number').textContent = `Câu ${currentQuestion + 1}`;
      document.getElementById('question-text').textContent = q.question;
      document.getElementById('progress-text').textContent = `Câu ${currentQuestion + 1}/4`;
      document.getElementById('progress-bar').style.width = `${(currentQuestion / 4) * 100}%`;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      q.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="mr-2">${['🅰️', '🅱️', '©️', '🅳'][index]}</span> ${option.substring(3)}`;
        btn.onclick = () => selectAnswer(index, btn);
        optionsContainer.appendChild(btn);
      });

      document.getElementById('next-btn-container').classList.add('hidden');
      document.getElementById('mascot').textContent = '🐱';
    }

    function selectAnswer(index, btn) {
      if (questionAnsweredCorrectly) return;

      const q = questions[currentQuestion];
      const isCorrect = index === q.correct;

      if (isCorrect) {
        btn.classList.add('correct-answer');
        score++;
        updateScore();
        showCorrectFeedback();
        createFireworks();
        questionAnsweredCorrectly = true;

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.style.pointerEvents = 'none');

        document.getElementById('next-btn-container').classList.remove('hidden');
      } else {
        btn.classList.add('wrong-answer');
        btn.style.pointerEvents = 'none';
        showWrongFeedback();
      }
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function updateScore() {
      document.getElementById('score').textContent = score;
    }

    function showCorrectFeedback() {
      document.getElementById('mascot').textContent = '😸';
      const overlay = document.getElementById('feedback-overlay');
      const content = document.getElementById('feedback-content');

      content.innerHTML = `
        <div class="feedback-emoji">🎉</div>
        <div class="feedback-title correct">Chính xác!</div>
        <div class="feedback-message">Tuyệt vời lắm! +1 điểm 🌟</div>
      `;

      overlay.classList.remove('hidden');
      setTimeout(() => overlay.classList.add('hidden'), 2000);
    }

    function showWrongFeedback() {
      document.getElementById('mascot').textContent = '😿';
      const overlay = document.getElementById('feedback-overlay');
      const content = document.getElementById('feedback-content');

      content.innerHTML = `
        <div style="position: relative;">
          <div class="feedback-emoji" style="animation: cry 0.5s ease-in-out infinite;">😢</div>
          <div style="position: absolute; top: 4rem; left: 50%; transform: translateX(-50%);">
            <div style="font-size: 1.5rem; animation: tear-drop 1s ease-in infinite;">💧</div>
          </div>
        </div>
        <div class="feedback-title wrong" style="margin-top: 1rem;">Chưa đúng rồi!</div>
        <div class="feedback-message">Cố gắng lên nhé! 💪</div>
      `;

      overlay.classList.remove('hidden');
      setTimeout(() => overlay.classList.add('hidden'), 2000);
    }

    function createFireworks() {
      const container = document.getElementById('fireworks-container');
      const colors = ['#9333ea', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#ef4444'];

      for (let burst = 0; burst < 5; burst++) {
        setTimeout(() => {
          const centerX = Math.random() * window.innerWidth;
          const centerY = Math.random() * window.innerHeight * 0.6;

          for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.className = 'firework-particle';
            particle.style.left = centerX + 'px';
            particle.style.top = centerY + 'px';
            particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

            const angle = (i / 20) * 360;
            const distance = 50 + Math.random() * 100;
            const tx = Math.cos(angle * Math.PI / 180) * distance;
            const ty = Math.sin(angle * Math.PI / 180) * distance;

            particle.style.transform = `translate(${tx}px, ${ty}px)`;
            container.appendChild(particle);

            setTimeout(() => particle.remove(), 1000);
          }

          for (let i = 0; i < 15; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * window.innerWidth + 'px';
            confetti.style.top = '-20px';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
            confetti.style.animationDelay = Math.random() * 0.5 + 's';

            container.appendChild(confetti);
            setTimeout(() => confetti.remove(), 3500);
          }
        }, burst * 200);
      }
    }

    function showResults() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      document.getElementById('final-score').textContent = score;

      let emoji, title, message;

      if (score === 4) {
        emoji = '🏆';
        title = 'Xuất sắc!';
        message = 'Bạn đã trả lời đúng tất cả các câu hỏi! Thật tuyệt vời! 🌟';
        createFireworks();
      } else if (score >= 3) {
        emoji = '🎉';
        title = 'Giỏi lắm!';
        message = 'Bạn đã nắm vững kiến thức rồi đấy! 💪';
      } else if (score >= 2) {
        emoji = '😊';
        title = 'Khá tốt!';
        message = 'Cố gắng ôn tập thêm nhé! 📚';
      } else {
        emoji = '💪';
        title = 'Cần cố gắng hơn!';
        message = 'Hãy xem lại bài và thử lại nhé! 📖';
      }

      document.getElementById('result-emoji').textContent = emoji;
      document.getElementById('result-title').textContent = title;
      document.getElementById('result-message').textContent = message;
    }

    function restartGame() {
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }
  </script>
